trigger:
  - main
  - release*

pr: 
  - main
  - release*
  
resources:
- repo: self

stages:
- stage: Build
  jobs:
  - job: Windows
    timeoutInMinutes: 180

    pool:
      vmImage: windows-2022

    variables:
      HLSL_SRC_DIR: '$(Build.SourcesDirectory)'
      HLSL_BLD_DIR: '$(Agent.BuildDirectory)'
      platform: x64

    strategy:
      matrix:
        VS2022_Release:
         configuration: Release
         spirvBuildFlag: -spirvtest
        VS2022_Debug:
         configuration: Debug
         spirvBuildFlag: -spirvtest
        VS2022_Release_NoSPIRV:
         configuration: Release
         spirvBuildFlag: ''

    steps:
    - checkout: self
      clean: true
      submodules: true
    - script: |
        call utils\hct\hctstart.cmd %HLSL_SRC_DIR% %HLSL_BLD_DIR%
        call utils\hct\hctbuild.cmd -vs2022 -$(platform) -$(configuration) -show-cmake-log $(spirvBuildFlag) -warp-nuget-version 1.0.16.1
      displayName: 'Building'
    - script: |
        call utils\hct\hctstart.cmd %HLSL_SRC_DIR% %HLSL_BLD_DIR%
        call utils\hct\hcttest.cmd -$(configuration) noexec
      displayName: 'DXIL Tests'
    - script: |
        call utils\hct\hctstart.cmd %HLSL_SRC_DIR% %HLSL_BLD_DIR%
        call utils\hct\hcttest.cmd -$(configuration) exec
      displayName: 'DXIL Execution Tests'        
    - script: |
        call utils\hct\hctstart.cmd %HLSL_SRC_DIR% %HLSL_BLD_DIR%
        call utils\hct\hcttest.cmd -$(configuration) extdxil
      displayName: 'External DXIL Validator Tests'
      condition: succeededOrFailed()
    - script: |
        call utils\hct\hctstart.cmd %HLSL_SRC_DIR% %HLSL_BLD_DIR%
        call utils\hct\hcttest.cmd -$(configuration) compat-suite v1.6.2112
      displayName: 'DXIL Compat Suite Tests (1.6 release)'
      condition: succeededOrFailed()
    - script: |
        call utils\hct\hctstart.cmd %HLSL_SRC_DIR% %HLSL_BLD_DIR%
        call utils\hct\hcttest.cmd -$(configuration) compat-suite v1.7.2308
      displayName: 'DXIL Compat Suite Tests (1.7 release)'
      condition: succeededOrFailed()
    - script: |
        call utils\hct\hctstart.cmd %HLSL_SRC_DIR% %HLSL_BLD_DIR%
        call utils\hct\hcttest.cmd -$(configuration) compat-suite v1.8.2502
      displayName: 'DXIL Compat Suite Tests (1.8 release)'
      condition: succeededOrFailed()
    - script: |
        call utils\hct\hctstart.cmd %HLSL_SRC_DIR% %HLSL_BLD_DIR%
        call utils\hct\hcttest.cmd -$(configuration) compat-suite v1.8.2505.1
      displayName: 'DXIL Compat Suite Tests (1.8 point release)'
      condition: succeededOrFailed()
    

  - job: Nix
    timeoutInMinutes: 165

    variables:
      macOS: macOS-latest
      linux: Ubuntu-24.04

    strategy:
      matrix:
        Linux_Clang_RelWithDebInfo:
          image: ${{ variables.linux }}
          configuration: RelWithDebInfo
          CC: clang-18
          CXX: clang++-18
          CMAKE_OPTS: -DLLVM_ENABLE_WERROR=On -DLLVM_USE_SANITIZER='Address;Undefined' -DLLVM_ENABLE_LIBCXX=On -DLLVM_USE_LINKER=lld-18
          CHECK_ALL_ENV: ASAN_OPTIONS=alloc_dealloc_mismatch=0 LSAN_OPTIONS=suppressions=$BUILD_SOURCESDIRECTORY/utils/asan/x86_64-pc-linux-gnu.lsan.supp:print_suppressions=0 ASAN_SYMBOLIZER_PATH=/usr/bin/llvm-symbolizer-18 LSAN_SYMBOLIZER_PATH=/usr/bin/llvm-symbolizer-18
          OS: Linux
        Linux_Clang_Debug:
          image: ${{ variables.linux }}
          configuration: Debug
          CC: clang
          CXX: clang++
          CMAKE_OPTS: -DLLVM_ENABLE_WERROR=On -DLLVM_USE_LINKER=lld
        Linux_Gcc_Release:
          image: ${{ variables.linux }}
          configuration: Release
          CC: gcc
          CXX: g++
        Linux_Gcc_Debug:
          image: ${{ variables.linux }}
          configuration: Debug
          CC: gcc
          CXX: g++
          CMAKE_OPTS: -DLLVM_USE_SPLIT_DWARF=On
        MacOS_Clang_Release:
          image: ${{ variables.macOS }}
          configuration: Release
          CC: clang
          CXX: clang++
          CMAKE_OPTS: -DLLVM_ENABLE_WERROR=On
          OS: MacOS
        MacOS_Clang_Debug:
          image: ${{ variables.macOS }}
          configuration: Debug
          CC: clang
          CXX: clang++
          CMAKE_OPTS: -DLLVM_ENABLE_WERROR=On

    pool:
      vmImage: $(image)

    steps:
    - checkout: self
      clean: true
      submodules: true

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.x'

    - bash: |
        sudo apt-get update
        sudo apt-get upgrade libc6 libc6-dbg
        sudo apt-get install ninja-build
        wget https://apt.llvm.org/llvm.sh
        chmod u+x llvm.sh
        sudo ./llvm.sh 18
        sudo apt-get install libc++-18-dev
      displayName: 'Installing dependencies'
      condition: eq(variables['image'], variables['linux'])

    - bash: |
        brew update
        brew install ninja
        ulimit -Sn 1024
      displayName: 'Installing dependencies'
      condition: eq(variables['image'], variables['macOS'])
    - bash: |
        cmake -B build -G Ninja $BUILD_SOURCESDIRECTORY -DLLVM_LIT_ARGS='-v --xunit-xml-output=testresults.xunit.xml' -C $BUILD_SOURCESDIRECTORY/cmake/caches/PredefinedParams.cmake -DSPIRV_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=$(configuration) -DCMAKE_C_COMPILER=$(CC) -DCMAKE_CXX_COMPILER=$(CXX) $(CMAKE_OPTS)
      displayName: 'Running Cmake'
    - bash: |
        ninja -C build test-depends
      displayName: 'Building'
    - bash: |
        ./build/bin/dxc -T ps_6_0 tools/clang/test/CodeGenSPIRV/passthru-ps.hlsl2spv
        ./build/bin/dxc -T ps_6_0 -Fo passthru-ps.dxil tools/clang/test/CodeGenSPIRV/passthru-ps.hlsl2spv
        ./build/bin/dxc -T ps_6_0 -Fo passthru-ps.spv tools/clang/test/CodeGenSPIRV/passthru-ps.hlsl2spv -spirv
        ls -ld $AGENT_BUILDDIRECTORY
        ls -ld $BUILD_SOURCESDIRECTORY
      displayName: 'Smoke tests'
    - bash: $(CHECK_ALL_ENV) ninja -C build check-all
      displayName: 'DXC tests'
    - bash: $(CHECK_ALL_ENV) ninja -C build check-extdxil
      displayName: 'External DXIL Validator tests'
    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/testresults.xunit.xml'
      condition: succeededOrFailed()

- stage: VulkanSDKReleaseCandidate
  displayName: 'Vulkan SDK release candidate'
  dependsOn: []   # independent of Build; runs in parallel
  condition: startsWith(variables['Build.SourceBranch'], 'refs/heads/release/vulkan/')
  variables:
    HLSL_SRC_DIR: '$(Build.SourcesDirectory)'
    HLSL_BLD_DIR: '$(Agent.BuildDirectory)'
    platform: x64
    # Software drivers the offload tests run against (recorded against the candidate).
    LAVAPIPE_VERSION: '26.1.2'   # pal1000/mesa-dist-win release tag
    WARP_VERSION: '1.0.19'       # offload-test-suite WARP nuget (LKG)

  jobs:
  - job: Build
    displayName: 'Build DXC for SPIR-V'
    timeoutInMinutes: 120
    pool:
      vmImage: windows-2022
    strategy:
      matrix:
        Release:
          configuration: Release
        Debug:
          configuration: Debug
    steps:
    - checkout: self
      clean: true
      submodules: true
    - script: |
        call utils\hct\hctstart.cmd %HLSL_SRC_DIR% %HLSL_BLD_DIR%
        call utils\hct\hctbuild.cmd -vs2022 -$(platform) -$(configuration) -spirv -spirvtest -show-cmake-log
      displayName: 'Building (SPIR-V)'
    - script: |
        call utils\hct\hctstart.cmd %HLSL_SRC_DIR% %HLSL_BLD_DIR%
        call utils\hct\hcttest.cmd -$(configuration) spirv
      displayName: 'SPIR-V Tests'
      condition: succeededOrFailed()
    # Publish the Release binaries (DXC_DIR) for the offload job. dxil.dll is needed
    # to sign DXIL for the WARP/Direct3D 12 run.
    - pwsh: |
        $bin = "$(HLSL_BLD_DIR)\$(configuration)\bin"
        $dst = "$(Build.ArtifactStagingDirectory)\dxc"
        New-Item -ItemType Directory -Force -Path $dst | Out-Null
        foreach ($f in @("dxc.exe","dxv.exe","dxcompiler.dll","dxil.dll")) {
          if (Test-Path "$bin\$f") { Copy-Item "$bin\$f" $dst } else { Write-Warning "missing $f" }
        }
      displayName: 'Stage DXC binaries'
      condition: and(succeeded(), eq(variables['configuration'], 'Release'))
    - task: PublishPipelineArtifact@1
      displayName: 'Publish DXC binaries'
      condition: and(succeeded(), eq(variables['configuration'], 'Release'))
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)\dxc'
        artifact: 'dxc_vulkan'

  - job: OffloadTests
    displayName: 'Offload tests (lavapipe + WARP)'
    dependsOn: Build
    timeoutInMinutes: 180
    pool:
      vmImage: windows-2022
    variables:
      # vcvars persists the MSVC env to later steps so cmake/ninja find cl.exe.
      VS_DEV: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat'
    workspace:
      clean: all
    steps:
    - checkout: none

    - task: DownloadPipelineArtifact@2
      displayName: 'Download DXC binaries'
      inputs:
        artifact: 'dxc_vulkan'
        path: '$(Agent.TempDirectory)\dxc'

    - pwsh: |
        $dxc = Get-ChildItem "$(Agent.TempDirectory)\dxc" -Recurse -Filter dxc.exe | Select-Object -First 1
        if (-not $dxc) { throw "dxc.exe not found in the published binaries" }
        Write-Host "##vso[task.setvariable variable=DXC_DIR]$($dxc.Directory.FullName)"
        Write-Host "DXC_DIR = $($dxc.Directory.FullName)"
      displayName: 'Locate DXC_DIR'

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
    - script: choco install ninja -y
      displayName: 'Install Ninja'
    - task: BatchScript@1
      displayName: 'Set up MSVC environment'
      inputs:
        filename: '$(VS_DEV)'
        modifyEnvironment: true

    # The offload suite's Vulkan backend (check-hlsl-vk) is only built when
    # find_package(Vulkan) succeeds, so install the Vulkan SDK (headers + loader).
    - pwsh: |
        $exe = "$(Agent.TempDirectory)\VulkanSDK.exe"
        Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe?Human=true" -OutFile $exe
        Start-Process $exe -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -Wait
        $sdk = (Get-ChildItem "C:\VulkanSDK" -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
        if (-not $sdk) { throw "Vulkan SDK install dir not found under C:\VulkanSDK" }
        Write-Host "##vso[task.setvariable variable=VULKAN_SDK]$sdk"
        Write-Host "##vso[task.prependpath]$sdk\Bin"
        Write-Host "VULKAN_SDK = $sdk"
      displayName: 'Install Vulkan SDK'

    # lavapipe (Mesa's CPU Vulkan) registered in the registry -- the Vulkan loader
    # ignores VK_DRIVER_FILES when the process is elevated, so the registry is the
    # only discovery path. The Mesa folder also ships dxil.dll (DXIL signing).
    - pwsh: |
        $ver = "$(LAVAPIPE_VERSION)"
        $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$ver/mesa3d-$ver-release-msvc.7z"
        Invoke-WebRequest $url -OutFile "$(Agent.TempDirectory)\mesa.7z"
        7z x "$(Agent.TempDirectory)\mesa.7z" -o"$(Agent.TempDirectory)\mesa" -y | Out-Null
        $lvp = (Get-ChildItem "$(Agent.TempDirectory)\mesa" -Recurse -Filter "lvp_icd.x86_64.json" | Select-Object -First 1).FullName
        if (-not $lvp) { throw "lavapipe ICD (lvp_icd.x86_64.json) not found in Mesa package" }
        reg add "HKLM\SOFTWARE\Khronos\Vulkan\Drivers" /v "$lvp" /t REG_DWORD /d 0 /f /reg:64
        Write-Host "##vso[task.setvariable variable=MESA_BIN]$(Split-Path $lvp)"
        Write-Host "Registered lavapipe ICD: $lvp"
      displayName: 'Install lavapipe (Mesa) and register the ICD'

    - pwsh: |
        git clone --depth 1 https://github.com/llvm/offload-test-suite OffloadTest
        git clone --depth 1 https://github.com/llvm/llvm-project llvm-project
        git clone --depth 1 https://github.com/llvm/offload-golden-images golden-images
        python -m pip install -r OffloadTest/test/requirements.txt
      displayName: 'Checkout offload-test-suite + LLVM'
      workingDirectory: '$(Agent.TempDirectory)'

    - script: >
        cmake -G Ninja -B llvm-project/build
        -DCMAKE_BUILD_TYPE=Release -DLLVM_ENABLE_ASSERTIONS=On
        -DLLVM_EXTERNAL_PROJECTS=OffloadTest
        -C llvm-project/clang/cmake/caches/HLSL.cmake
        -DDXC_DIR="$(DXC_DIR)"
        -DLLVM_EXTERNAL_OFFLOADTEST_SOURCE_DIR=$(Agent.TempDirectory)/OffloadTest
        -DGOLDENIMAGE_DIR=$(Agent.TempDirectory)/golden-images
        -DOFFLOADTEST_TEST_CLANG=Off
        -DWARP_VERSION=$(WARP_VERSION)
        -DLLVM_LIT_ARGS="--xunit-xml-output=testresults.xunit.xml -v"
        llvm-project/llvm
      displayName: 'Configure LLVM + OffloadTest against DXC'
      workingDirectory: '$(Agent.TempDirectory)'

    - script: cmake --build llvm-project/build --target hlsl-test-depends
      displayName: 'Build offload test dependencies'
      workingDirectory: '$(Agent.TempDirectory)'

    # Vulkan path: candidate's SPIR-V on lavapipe. PATH gets the Mesa folder so the
    # ICD DLLs resolve their dependencies; VK_LOADER_DEBUG is kept for diagnostics.
    - pwsh: |
        $env:PATH = "$(MESA_BIN);$env:PATH"
        $env:VK_LOADER_DEBUG = "all"
        $env:LIT_OPTS = "--xunit-xml-output=$(Agent.TempDirectory)/results-vk-lavapipe.xml"
        cmake --build llvm-project/build --target check-hlsl-vk
      displayName: 'Vulkan offload tests on lavapipe'
      workingDirectory: '$(Agent.TempDirectory)'

    # Direct3D 12 path: candidate's DXIL on WARP (downloaded by the suite's setup_warp).
    - pwsh: |
        $env:PATH = "$(MESA_BIN);$env:PATH"
        $env:LIT_OPTS = "--xunit-xml-output=$(Agent.TempDirectory)/results-d3d12-warp.xml"
        cmake --build llvm-project/build --target check-hlsl-warp-d3d12
      displayName: 'DirectX offload tests on WARP'
      condition: succeededOrFailed()
      workingDirectory: '$(Agent.TempDirectory)'

    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '$(Agent.TempDirectory)/results-*.xml'
