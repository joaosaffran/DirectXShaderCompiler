name: "Offload tests (software Vulkan)"

# Runs the LLVM offload-test-suite Vulkan tests (check-hlsl-vk) against a DXC release
# candidate on two software Vulkan backends: lavapipe (Mesa's pure-CPU Vulkan) and
# Dozen (Mesa's Vulkan-on-D3D12, dzn) on the WARP software adapter. Reusable:
#   * workflow_call -- the Vulkan SDK RC pipeline invokes it after publishing.
#   * workflow_dispatch -- run it STANDALONE against an existing candidate artifact, so
#     the heavy DXC build doesn't have to be repeated while iterating on the offload
#     setup. Give it the run_id of a prior pipeline run and the artifact name.

on:
  workflow_call:
    inputs:
      artifact_name:
        description: "dxc_rc_<version> artifact name."
        type: string
        required: true
      run_id:
        description: "ID of the run that produced the artifact."
        type: string
        required: true
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID of the pipeline run that produced the dxc_rc artifact."
        type: string
        required: true
      artifact_name:
        description: "Artifact name from that run (e.g. dxc_rc_main)."
        type: string
        required: true
        default: "dxc_rc_main"

permissions:
  contents: read
  actions: read   # download-artifact from another run uses the Actions API

jobs:
  offload-tests:
    runs-on: windows-latest
    steps:
      - name: Download the release candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: rc

      - name: Locate DXC_DIR
        id: dxc
        shell: pwsh
        run: |
          $dxc = Get-ChildItem rc -Recurse -Filter dxc.exe | Select-Object -First 1
          if (-not $dxc) { throw "dxc.exe not found in the RC artifact '${{ inputs.artifact_name }}'" }
          "dir=$($dxc.Directory.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "DXC_DIR = $($dxc.Directory.FullName)"

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The offload suite's Vulkan backend -- and the check-hlsl-vk target -- is only
      # built when find_package(Vulkan) succeeds, so install the Vulkan SDK for the
      # headers + loader (vulkan-1.lib/.dll). The runtime ICD is supplied separately.
      - name: Install Vulkan SDK (headers + loader)
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\VulkanSDK.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe?Human=true" -OutFile $exe
          Start-Process $exe -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -Wait
          $sdk = (Get-ChildItem "C:\VulkanSDK" -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          if (-not $sdk) { throw "Vulkan SDK install dir not found under C:\VulkanSDK" }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$sdk\Bin"        | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "VULKAN_SDK = $sdk"

      # Fetch Mesa's software Vulkan drivers -- lavapipe (lvp, pure-CPU Vulkan) and
      # Dozen (dzn, Vulkan-on-D3D12, runs on the WARP software adapter) -- and REGISTER
      # both ICDs in HKLM\SOFTWARE\Khronos\Vulkan\Drivers. The Vulkan loader IGNORES
      # VK_DRIVER_FILES / VK_ICD_FILENAMES when the process is elevated, and
      # GitHub-hosted runners run elevated, so the registry is the ONLY way to make a
      # driver discoverable. Use reg.exe (the value name is the full ICD path; a path
      # contains ':' and '\', which PowerShell's New-ItemProperty -Name mangles). Pick
      # the .x86_64.json (a 32-bit .x86.json would load as VK_ERROR_INCOMPATIBLE_DRIVER).
      # Both ICDs are registered together; each test run below selects one device by
      # name via OFFLOADTEST_GPU_NAME.
      - name: Fetch and register Mesa Vulkan drivers (lavapipe + Dozen)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = gh release view -R pal1000/mesa-dist-win --json assets `
            --jq '.assets[].name | select(test("release-msvc\\.7z$"))' | Select-Object -First 1
          if (-not $asset) { throw "no Mesa release-msvc.7z asset found" }
          gh release download -R pal1000/mesa-dist-win --pattern "$asset" -D "$env:RUNNER_TEMP\mesa"
          7z x "$env:RUNNER_TEMP\mesa\$asset" -o"$env:RUNNER_TEMP\mesa\x" -y | Out-Null
          $lvp = (Get-ChildItem "$env:RUNNER_TEMP\mesa\x" -Recurse -Filter "lvp_icd.x86_64.json" | Select-Object -First 1).FullName
          $dzn = (Get-ChildItem "$env:RUNNER_TEMP\mesa\x" -Recurse -Filter "dzn_icd.x86_64.json" | Select-Object -First 1).FullName
          if (-not $lvp) { throw "lavapipe ICD (lvp_icd.x86_64.json) not found in Mesa package" }
          if (-not $dzn) { throw "Dozen ICD (dzn_icd.x86_64.json) not found in Mesa package" }
          reg add "HKLM\SOFTWARE\Khronos\Vulkan\Drivers" /v "$lvp" /t REG_DWORD /d 0 /f /reg:64
          reg add "HKLM\SOFTWARE\Khronos\Vulkan\Drivers" /v "$dzn" /t REG_DWORD /d 0 /f /reg:64
          reg query "HKLM\SOFTWARE\Khronos\Vulkan\Drivers" /reg:64
          Write-Host "Registered lavapipe ICD: $lvp"
          Write-Host "Registered Dozen ICD:    $dzn"

      - name: Checkout offload-test-suite
        uses: actions/checkout@v4
        with:
          repository: llvm/offload-test-suite
          path: OffloadTest
          fetch-depth: 1

      # The suite tags any "Microsoft Basic Render Driver" device as WARP and adds
      # config.warp_arch as a feature -- but warp_arch is only defined for the
      # warp-d3d12 suite (gated by FORCE_WARP, hardcoded False for the vk suite, not a
      # cmake option). Our Vulkan device is Dozen-on-WARP, so the vk suite hits that
      # path with warp_arch unset -> AttributeError. Default it to the host arch so the
      # vk suite tolerates a WARP-backed Vulkan device. (Worth upstreaming in
      # offload-test-suite; this is a local workaround.)
      - name: Patch OffloadTest to tolerate a WARP-backed Vulkan device
        shell: pwsh
        run: |
          $f = "OffloadTest/test/lit.cfg.py"
          $c = Get-Content $f -Raw
          $patched = $c -replace 'config\.available_features\.add\(config\.warp_arch\)', 'config.available_features.add(getattr(config, "warp_arch", "x64"))'
          if ($patched -eq $c) { Write-Warning "warp_arch patch pattern not found; OffloadTest lit.cfg.py may have changed upstream" }
          Set-Content -Path $f -Value $patched -NoNewline
          Write-Host "Patched $f"

      - name: Checkout LLVM
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          path: llvm-project
          fetch-depth: 1
      - name: Checkout golden images
        uses: actions/checkout@v4
        with:
          repository: llvm/offload-golden-images
          path: golden-images
          fetch-depth: 1
      - name: Install OffloadTest python deps
        run: python -m pip install -r OffloadTest/test/requirements.txt

      - name: Configure LLVM + OffloadTest against the RC's DXC
        run: >-
          cmake -G Ninja -B llvm-project/build
          -DCMAKE_BUILD_TYPE=Release -DLLVM_ENABLE_ASSERTIONS=On
          -DLLVM_EXTERNAL_PROJECTS=OffloadTest
          -C llvm-project/clang/cmake/caches/HLSL.cmake
          -DDXC_DIR="${{ steps.dxc.outputs.dir }}"
          -DLLVM_EXTERNAL_OFFLOADTEST_SOURCE_DIR=${{ github.workspace }}/OffloadTest
          -DGOLDENIMAGE_DIR=${{ github.workspace }}/golden-images
          -DOFFLOADTEST_TEST_CLANG=Off
          -DLLVM_LIT_ARGS="--xunit-xml-output=testresults.xunit.xml -v"
          llvm-project/llvm

      - name: Build offload test dependencies
        run: cmake --build llvm-project/build --target hlsl-test-depends

      # Both ICDs are registered, so check-hlsl-vk would enumerate both devices; the
      # suite's OFFLOADTEST_GPU_NAME (a regex matched against the device Description,
      # read in Python -- NOT a loader VK_* var, so elevation doesn't strip it) selects
      # which one. Prepend the Mesa driver folder to PATH so the ICD DLLs resolve their
      # dependencies (Dozen's vulkan_dzn.dll needs dxil.dll, shipped alongside).
      # VK_LOADER_DEBUG is honored even when elevated, so keep it for diagnostics.
      - name: Run Vulkan offload tests on lavapipe (software Vulkan)
        shell: pwsh
        run: |
          $bin = (Get-ChildItem "$env:RUNNER_TEMP\mesa\x" -Recurse -Filter "lvp_icd.x86_64.json" | Select-Object -First 1).Directory.FullName
          if (-not $bin) { throw "lavapipe ICD (lvp_icd.x86_64.json) not found in Mesa package" }
          $env:PATH = "$bin;$env:PATH"
          $env:VK_LOADER_DEBUG = "all"
          $env:OFFLOADTEST_GPU_NAME = "llvmpipe"
          $env:LIT_OPTS = "--xunit-xml-output=$env:GITHUB_WORKSPACE\results-lavapipe.xml"
          cmake --build llvm-project/build --target check-hlsl-vk

      - name: Run Vulkan offload tests on WARP (Dozen)
        if: always()   # run even if the lavapipe pass failed
        shell: pwsh
        run: |
          $bin = (Get-ChildItem "$env:RUNNER_TEMP\mesa\x" -Recurse -Filter "dzn_icd.x86_64.json" | Select-Object -First 1).Directory.FullName
          if (-not $bin) { throw "Dozen ICD (dzn_icd.x86_64.json) not found in Mesa package" }
          $env:PATH = "$bin;$env:PATH"
          $env:VK_LOADER_DEBUG = "all"
          $env:OFFLOADTEST_GPU_NAME = "Basic Render Driver"
          $env:LIT_OPTS = "--xunit-xml-output=$env:GITHUB_WORKSPACE\results-warp.xml"
          cmake --build llvm-project/build --target check-hlsl-vk

      - name: Upload offload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offload-results-${{ inputs.artifact_name }}
          path: ${{ github.workspace }}/results-*.xml
          if-no-files-found: warn
