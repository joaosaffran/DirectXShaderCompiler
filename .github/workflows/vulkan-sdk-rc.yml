name: "Vulkan SDK release candidate"

# Prototype for INF-0007: prepare + validate DXC for a Vulkan SDK release.
#
# Builds DXC against the checked-out SPIRV-Headers / SPIRV-Tools submodule pointers
# (the source of truth for which SPIR-V ships) and runs every SPIR-V test
# (lit / TAEF / googletest) + spirv-val. Triggers:
#   * push to vk-update/** or release/vulkan/** -- the weekly-spirv-update workflow
#     opens vk-update PRs; release/vulkan branches are cut by hand for a release.
#   * workflow_dispatch -- manual run for any ref.
#
# The dxc_rc_<version> artifact and the offload-test-suite run (WARP + lavapipe) are
# the release-candidate deliverable -- produced only on release/vulkan/** pushes or
# a manual opt-in (publish_artifact), not on the weekly vk-update validation runs.

on:
  push:
    branches:
      - "release/vulkan/**"
      - "vk-update/**"
  workflow_dispatch:
    inputs:
      publish_artifact:
        description: "Upload the dxc_rc artifact (and run the offload tests) for this build."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.publish_gate.outputs.publish }}
    env:
      # TAEF test framework, restored from nuget (see the "Install TAEF" step).
      # Not on nuget.org -- served from the public feed microsoft/terminal uses.
      TAEF_VERSION: "10.100.251104001"
      TAEF_FEED: "https://pkgs.dev.azure.com/shine-oss/terminal/_packaging/TerminalDependencies%40Local/nuget/v3/index.json"
    steps:
      - name: Checkout DXC
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The SPIRV-Headers / SPIRV-Tools submodule pointers are the source of
          # truth for the SPIR-V deps, so check them out as committed.
          submodules: true

      # The SDK version is the trailing segment of the release/vulkan/<version>
      # branch; it names the published artifact (dxc_rc_<version>). vk-update and
      # other refs fall back to the sanitized ref name.
      - name: Determine SDK version
        id: version
        shell: bash
        run: |
          ref="${{ github.ref_name }}"
          version="${ref#release/vulkan/}"   # strip the branch prefix if present
          version="${version//\//-}"          # sanitize any remaining slashes
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "SDK version: $version"

      # The artifact + offload run are the release-candidate deliverable: produced on
      # release/vulkan/** pushes, or on a manual run that opts in. Weekly vk-update
      # validation runs build + test only.
      - name: Decide whether to publish the candidate
        id: publish_gate
        shell: bash
        run: |
          publish=false
          if [[ "${{ github.ref }}" == refs/heads/release/vulkan/* ]]; then
            publish=true
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish_artifact }}" == "true" ]]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "publish candidate (artifact + offload): $publish"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      # Puts cl.exe / link.exe and the MSVC headers on PATH so the Ninja
      # generator can find the compiler. Required for every build/test step below.
      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # DXC's Windows test targets do find_package(TAEF REQUIRED), and TAEF isn't
      # on the runner. Restore the Microsoft.Taef nuget package (nuget.exe is
      # preinstalled on windows runners) and export the include dir + TE.exe so
      # build_and_test.py can pre-seed FindTAEF.cmake. We discover the paths rather
      # than hardcode them because the binaries folder name varies between TAEF
      # versions (e.g. build/Binaries/x64 vs build/Binaries/amd64).
      - name: Install TAEF (test framework)
        shell: pwsh
        run: |
          nuget install Microsoft.Taef -Version $env:TAEF_VERSION -Source $env:TAEF_FEED -OutputDirectory "$env:RUNNER_TEMP\taef" -ExcludeVersion
          $root = "$env:RUNNER_TEMP\taef\Microsoft.Taef"
          $te  = Get-ChildItem $root -Recurse -Filter TE.exe | Where-Object { $_.FullName -match '\\(x64|amd64)\\' } | Select-Object -First 1
          $inc = Get-ChildItem $root -Recurse -Filter Wex.Common.h | Select-Object -First 1
          if (-not $te -or -not $inc) { throw "Could not locate TE.exe / Wex.Common.h in restored TAEF package" }
          "TAEF_EXECUTABLE=$($te.FullName)"        | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAEF_INCLUDE_DIR=$($inc.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "TAEF $env:TAEF_VERSION: TE.exe=$($te.FullName)  include=$($inc.Directory.FullName)"

      # --allow-test-failures: record failures in the manifest but still exit 0,
      # so a test regression doesn't block publishing the candidate. Gate on the
      # manifest's "validated" field downstream instead.
      - name: Build DXC and validate SPIR-V output
        run: python utils/vulkan-sdk/build_and_test.py --build-dir build --allow-test-failures

      - name: Upload release candidate
        # Only on the deliverable path (release branch / manual opt-in). always() so
        # a problem in an earlier step doesn't skip the upload; a genuine build
        # failure leaves no dxc.exe, so if-no-files-found: warn keeps that from
        # masking the real error.
        if: ${{ always() && steps.publish_gate.outputs.publish == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dxc_rc_${{ steps.version.outputs.version }}
          # The DXC tools the offload-tests job needs as DXC_DIR (dxc.exe needs
          # dxcompiler.dll to run; DXC_DIR holds dxc + dxv), the manifest, and the
          # per-suite JUnit reports.
          path: |
            build/bin/dxc.exe
            build/bin/dxv.exe
            build/bin/dxcompiler.dll
            build/rc-manifest.json
            build/spirv-*-results.xml
          if-no-files-found: warn

  # Run the LLVM offload-test-suite Vulkan tests against the release candidate on
  # software renderers -- no physical GPUs. The DXC Vulkan SDK candidate emits
  # SPIR-V, so we run check-hlsl-vk on two software Vulkan backends: lavapipe (Mesa's
  # pure-CPU Vulkan) and Dozen (Mesa's Vulkan-on-D3D12, dzn) on the WARP software
  # adapter. Only on the deliverable path (release branch / manual opt-in).
  offload-tests:
    needs: build-and-validate
    if: ${{ needs.build-and-validate.outputs.publish == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Download the release candidate
        uses: actions/download-artifact@v4
        with:
          name: dxc_rc_${{ needs.build-and-validate.outputs.version }}
          path: rc

      - name: Locate DXC_DIR
        id: dxc
        shell: pwsh
        run: |
          $dxc = Get-ChildItem rc -Recurse -Filter dxc.exe | Select-Object -First 1
          if (-not $dxc) { throw "dxc.exe not found in the RC artifact" }
          "dir=$($dxc.Directory.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "DXC_DIR = $($dxc.Directory.FullName)"

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The offload suite's Vulkan backend -- and the check-hlsl-vk target -- is only
      # built when find_package(Vulkan) succeeds, so install the Vulkan SDK for the
      # headers + loader (vulkan-1.lib/.dll). The runtime ICD is supplied separately.
      - name: Install Vulkan SDK (headers + loader)
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\VulkanSDK.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe?Human=true" -OutFile $exe
          Start-Process $exe -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -Wait
          $sdk = (Get-ChildItem "C:\VulkanSDK" -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          if (-not $sdk) { throw "Vulkan SDK install dir not found under C:\VulkanSDK" }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$sdk\Bin"        | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "VULKAN_SDK = $sdk"

      # Two software Vulkan ICDs from the Windows Mesa build: lavapipe (lvp, pure CPU)
      # and Dozen (dzn, Vulkan-on-D3D12 -- runs on the WARP software D3D12 adapter).
      # VK_DRIVER_FILES isn't exported globally; each test run below selects one ICD.
      - name: Install Mesa software Vulkan ICDs (lavapipe + Dozen)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = gh release view -R pal1000/mesa-dist-win --json assets `
            --jq '.assets[].name | select(test("release-msvc\\.7z$"))' | Select-Object -First 1
          if (-not $asset) { throw "no Mesa release-msvc.7z asset found" }
          gh release download -R pal1000/mesa-dist-win --pattern "$asset" -D "$env:RUNNER_TEMP\mesa"
          7z x "$env:RUNNER_TEMP\mesa\$asset" -o"$env:RUNNER_TEMP\mesa\x" -y | Out-Null
          $lvp = (Get-ChildItem "$env:RUNNER_TEMP\mesa\x" -Recurse -Filter "lvp_icd*.json" | Select-Object -First 1).FullName
          $dzn = (Get-ChildItem "$env:RUNNER_TEMP\mesa\x" -Recurse -Filter "dzn_icd*.json" | Select-Object -First 1).FullName
          if (-not $lvp) { throw "lavapipe ICD (lvp_icd*.json) not found in Mesa package" }
          if (-not $dzn) { throw "Dozen ICD (dzn_icd*.json) not found in Mesa package" }
          "LVP_ICD=$lvp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DZN_ICD=$dzn" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "lavapipe ICD: $lvp"
          Write-Host "Dozen ICD:    $dzn"

      - name: Checkout offload-test-suite
        uses: actions/checkout@v4
        with:
          repository: llvm/offload-test-suite
          path: OffloadTest
          fetch-depth: 1
      - name: Checkout LLVM
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          path: llvm-project
          fetch-depth: 1
      - name: Checkout golden images
        uses: actions/checkout@v4
        with:
          repository: llvm/offload-golden-images
          path: golden-images
          fetch-depth: 1
      - name: Install OffloadTest python deps
        run: python -m pip install -r OffloadTest/test/requirements.txt

      - name: Configure LLVM + OffloadTest against the RC's DXC
        run: >-
          cmake -G Ninja -B llvm-project/build
          -DCMAKE_BUILD_TYPE=Release -DLLVM_ENABLE_ASSERTIONS=On
          -DLLVM_EXTERNAL_PROJECTS=OffloadTest
          -C llvm-project/clang/cmake/caches/HLSL.cmake
          -DDXC_DIR="${{ steps.dxc.outputs.dir }}"
          -DLLVM_EXTERNAL_OFFLOADTEST_SOURCE_DIR=${{ github.workspace }}/OffloadTest
          -DGOLDENIMAGE_DIR=${{ github.workspace }}/golden-images
          -DOFFLOADTEST_TEST_CLANG=Off
          -DLLVM_LIT_ARGS="--xunit-xml-output=testresults.xunit.xml -v"
          llvm-project/llvm

      - name: Build offload test dependencies
        run: cmake --build llvm-project/build --target hlsl-test-depends

      - name: Run Vulkan offload tests on lavapipe (software Vulkan)
        env:
          VK_DRIVER_FILES: ${{ env.LVP_ICD }}
          VK_ICD_FILENAMES: ${{ env.LVP_ICD }}
          LIT_OPTS: --xunit-xml-output=${{ github.workspace }}/results-lavapipe.xml
        run: cmake --build llvm-project/build --target check-hlsl-vk

      - name: Run Vulkan offload tests on WARP (Dozen, Vulkan-on-D3D12)
        if: always()   # run even if the lavapipe pass failed
        env:
          VK_DRIVER_FILES: ${{ env.DZN_ICD }}
          VK_ICD_FILENAMES: ${{ env.DZN_ICD }}
          LIT_OPTS: --xunit-xml-output=${{ github.workspace }}/results-warp-dozen.xml
        run: cmake --build llvm-project/build --target check-hlsl-vk

      - name: Upload offload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offload-results-${{ needs.build-and-validate.outputs.version }}
          path: ${{ github.workspace }}/results-*.xml
          if-no-files-found: warn
